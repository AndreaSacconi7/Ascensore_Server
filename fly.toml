# Fly.io: at most one machine. A match lives in one server's memory (saved to Postgres after every move), so the
# app must never run on two machines at once. With nobody connected the machine is suspended (scale to zero):
# the first player to connect wakes it in about a second.
app = "ascensore-server"
primary_region = "fra"

# Spring shuts down cleanly on SIGTERM: queued moves finish and the last snapshots are written
kill_signal = "SIGTERM"
kill_timeout = 30

[build]

[deploy]
  # The machine is updated in place: the old server stops before the new one starts, so two servers never
  # restore the same matches (do not switch to bluegreen)
  strategy = "rolling"

[env]
  TURN_SECONDS = "30"
  # Set by Fly's proxy on every request: the player's real address, for the per-address connection limit
  CLIENT_IP_HEADER = "Fly-Client-IP"

[http_service]
  internal_port = 8080
  force_https = true
  # An open WebSocket counts as traffic: the machine only sleeps once every player has disconnected, and
  # sockets that never log in are closed after 15 s, so they cannot keep it awake
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1500
    hard_limit = 2000

  [[http_service.checks]]
    grace_period = "40s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
