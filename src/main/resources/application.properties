spring.application.name=ascensore-server

# Port: most hosts (Fly.io, Railway, Render) inject PORT
server.port=${PORT:8080}

# Supabase project: public signing keys for the players' access tokens
supabase.jwks-url=${SUPABASE_JWT_URL}

# Supabase Postgres. The direct host db.<project>.supabase.co is IPv6-only: on IPv4-only hosts use the
# connection pooler URL from the Supabase dashboard instead.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Matches: players choose 2-4 when joining (this is the default); hands go 1..max..1 (players x max <= 40)
ascensore.players-per-match=${PLAYERS_PER_MATCH:2}
ascensore.max-hand-size=${MAX_HAND_SIZE:10}

# Seconds to bet or play before the server acts for the player (0 = no limit)
ascensore.turn-seconds=${TURN_SECONDS:30}

# A connection silent this long (no PING) is considered dead and closed
ascensore.idle-timeout-seconds=30

# Set to DEBUG to log every message sent to players
logging.level.polimi.ascensore=INFO
