supabase.jwks-url=${SUPABASE_JWT_URL}


# CONFIGURAZIONE SUPABASE (POSTGRESQL)
spring.datasource.url=jdbc:postgresql://db.hwjukdydgsejqbhzezyt.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# IMPORTANTE: Driver corretto
spring.datasource.driver-class-name=org.postgresql.Driver

# GESTIONE TABELLE (Il segreto della persistenza)
# 'update': Crea le tabelle se mancano, ma NON cancella i dati esistenti!
spring.jpa.hibernate.ddl-auto=update

# Per vedere le query SQL nella console (utile per debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
